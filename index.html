<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <nav class="border-b-1 border-b-gray-500 ">

        <div class="flex justify-between px-10 py-3 bg-[#1A0B2E]">

                <span class="text-[#FFFF]">Tech</span>

                <span

            </div>

            <ul class="hidden md:flex items-center gap-10 text-[#FFFFFF]">
                <li>About</li>
                <li>episode</li>
                <li>host</li>
            </ul>
            <button class="text-[#FFFFFF]">
                <a href="#" class="px-4 py-2 rounded-full bg-gradient-to-r from-[#F7E93F] via-[#FB09B4] to-[#9100F8]">

    <main>
        <div>

        </div>

        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 translate-y-60 text-white text-4xl font-bold">

            Your daily dose of tech insights, productivity hacks, and personal growth
        </div>

        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 translate-y-[320px] flex gap-4">

            <a href="#"
                class="px-4 py-2 rounded-full bg-gradient-to-r from-[#F7E93F] via-[#FB09B4] to-[#9100F8] text-white">
                Listen on Spotify
                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <a href="#" class="px-4 py-2 rounded-full border-2 border-green-400 text-green-400">
